version: 2
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let new releases age before proposing them (supply-chain hygiene).
    cooldown:
      default-days: 7

  # Also updates the SHA-pinned actions (keeping the `# vX.Y.Z` comments) in
  # the workflows and in .github/actions/.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-igraph
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
