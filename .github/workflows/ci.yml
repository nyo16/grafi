name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  MIX_ENV: test
  IGRAPH_VERSION: "1.0.1"

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18"
            otp: "28"

    steps:
      - uses: actions/checkout@v4

      - name: Install igraph build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex libxml2-dev libgmp-dev libglpk-dev pkg-config

      - name: Cache igraph install
        id: cache-igraph
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: ${{ runner.os }}-igraph-${{ env.IGRAPH_VERSION }}

      - name: Build and install igraph from source
        if: steps.cache-igraph.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/igraph/igraph/releases/download/${IGRAPH_VERSION}/igraph-${IGRAPH_VERSION}.tar.gz"
          tar xzf "igraph-${IGRAPH_VERSION}.tar.gz"
          cd "igraph-${IGRAPH_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          make -j"$(nproc)"
          sudo make install

      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # :nif-tagged tests are skipped when the NIF is unavailable, so fail
      # loudly here instead of silently testing only the Elixir engine.
      - name: Assert the NIF loaded
        run: |
          mix run -e 'Grafi.NIF.available?() || Mix.raise("the Grafi NIF did not load; :nif tests would be skipped")'

      # Three engine modes; each exports coverage, merged at the end.
      # packaging-release P3.5 must keep these steps.
      - name: Run tests (default threshold)
        run: mix test --cover --export-coverage default

      - name: Run tests (NIF for every graph size)
        env:
          GRAFI_NIF_THRESHOLD: "0"
        run: mix test --cover --export-coverage nif

      # config/runtime.exs maps GRAFI_NIF_ENABLED to `nif_enabled`. If that
      # wiring breaks, the next step silently re-runs the NIF suite and
      # skips every :no_nif test.
      - name: Assert the NIF is disabled
        env:
          GRAFI_NIF_ENABLED: "false"
        run: |
          mix run -e 'Grafi.NIF.available?() && Mix.raise("GRAFI_NIF_ENABLED=false did not disable the NIF; :no_nif tests would be skipped")'

      - name: Run tests (pure Elixir, no NIF)
        env:
          GRAFI_NIF_ENABLED: "false"
        run: mix test --cover --export-coverage elixir

      - name: Merge coverage
        run: mix test.coverage

  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install igraph build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake bison flex libxml2-dev libgmp-dev libglpk-dev pkg-config

      - name: Cache igraph install
        id: cache-igraph
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: ${{ runner.os }}-igraph-${{ env.IGRAPH_VERSION }}

      - name: Build and install igraph from source
        if: steps.cache-igraph.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/igraph/igraph/releases/download/${IGRAPH_VERSION}/igraph-${IGRAPH_VERSION}.tar.gz"
          tar xzf "igraph-${IGRAPH_VERSION}.tar.gz"
          cd "igraph-${IGRAPH_VERSION}"
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON
          make -j"$(nproc)"
          sudo make install

      - name: Refresh dynamic linker cache
        run: sudo ldconfig

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-quality-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-quality-

      - name: Cache PLTs
        uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-plt-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run Credo
        run: mix credo --strict

      - name: Run Dialyzer
        run: mkdir -p priv/plts && mix dialyzer
